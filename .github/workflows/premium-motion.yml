name: Apply Premium Motion Enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium CSS layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* TRYANGLE PREMIUM MOTION v1 */'
          if marker not in s:
              premium = r'''

/* TRYANGLE PREMIUM MOTION v1 */
/* طبقة إضافية فقط — لا تغيّر المحتوى أو الـlayout الحالي. */
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  inset: -18%;
  pointer-events: none;
  z-index: 1;
}
.hero::before {
  background:
    radial-gradient(circle at 18% 42%, rgba(0,180,216,.13), transparent 24%),
    radial-gradient(circle at 82% 58%, rgba(243,146,0,.10), transparent 25%);
  filter: blur(30px);
  animation: premiumAtmosphere 12s ease-in-out infinite alternate;
}
.hero::after {
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.055) 48%, transparent 60%);
  transform: translateX(-55%);
  animation: premiumSweep 9s ease-in-out infinite;
}

.hero-3d-scene {
  perspective: 1200px;
  transform-style: preserve-3d;
  will-change: transform;
}
.hero-3d-unit {
  transform-style: preserve-3d;
  filter: drop-shadow(0 28px 38px rgba(0,0,0,.42)) drop-shadow(0 0 24px rgba(0,180,216,.14));
  animation: premiumUnitFloat 5.5s ease-in-out infinite;
}
.hero-3d-side {
  transform-style: preserve-3d;
  animation: premiumSideDrift 7s ease-in-out infinite alternate;
}
.hero-3d-rings {
  transform-style: preserve-3d;
  animation: premiumRings 11s linear infinite;
  opacity: .82;
}
.hero-3d-air {
  filter: blur(.15px);
  animation: premiumAir 4.5s ease-in-out infinite;
}
.hero-3d-particle {
  animation: premiumParticle 4s ease-in-out infinite;
}
.hero-3d-particle:nth-of-type(2) { animation-delay: -1.2s; }
.hero-3d-particle:nth-of-type(3) { animation-delay: -2.4s; }

.hero-content {
  animation: premiumHeroIn 1s cubic-bezier(.16,1,.3,1) both;
}
.authorized-badge {
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 35px rgba(0,98,172,.12), inset 0 0 25px rgba(255,255,255,.025);
  animation: premiumBadge 4s ease-in-out infinite;
}
.hero-title {
  text-shadow: 0 10px 45px rgba(0,0,0,.28);
}
.hero-title span {
  filter: drop-shadow(0 0 18px rgba(243,146,0,.14));
  animation: premiumTitleGlow 3.8s ease-in-out infinite;
}
.btn-primary,
.btn-secondary {
  transform: translateZ(0);
  will-change: transform, box-shadow;
}
.btn-primary:hover,
.btn-secondary:hover {
  transform: translateY(-4px) scale(1.015);
}

.feature-card,
.product-card,
.service-card,
.faq-item,
.contact-card,
.maintenance-card {
  transform: translateZ(0);
  will-change: transform, box-shadow;
}
.feature-card:hover,
.product-card:hover,
.service-card:hover,
.contact-card:hover,
.maintenance-card:hover {
  transform: translateY(-9px) rotateX(1deg);
  box-shadow: 0 24px 55px rgba(0,0,0,.14), 0 0 0 1px rgba(0,180,216,.10);
}
.product-img-wrapper {
  perspective: 900px;
  transform-style: preserve-3d;
}
.product-img {
  transition: transform .65s cubic-bezier(.16,1,.3,1), filter .65s ease;
}
.product-card:hover .product-img {
  transform: scale(1.055) translateZ(18px);
  filter: saturate(1.06) contrast(1.02) drop-shadow(0 16px 20px rgba(0,0,0,.16));
}

.scroll-reveal,
.reveal-fade {
  backface-visibility: hidden;
}

@keyframes premiumAtmosphere {
  0% { transform: translate3d(-2%,0,0) scale(1); }
  100% { transform: translate3d(2%,-1.5%,0) scale(1.045); }
}
@keyframes premiumSweep {
  0%, 42% { transform: translateX(-55%) skewX(-8deg); opacity: 0; }
  52% { opacity: .8; }
  70%, 100% { transform: translateX(55%) skewX(-8deg); opacity: 0; }
}
@keyframes premiumUnitFloat {
  0%,100% { transform: translate3d(0,0,0) rotateX(0deg) rotateY(-1deg); }
  50% { transform: translate3d(0,-11px,0) rotateX(1.2deg) rotateY(1.8deg); }
}
@keyframes premiumSideDrift {
  0% { transform: translate3d(0,0,0) rotateY(-3deg); }
  100% { transform: translate3d(8px,-5px,12px) rotateY(3deg); }
}
@keyframes premiumRings {
  from { transform: rotateZ(0deg) rotateX(0deg); }
  to { transform: rotateZ(360deg) rotateX(8deg); }
}
@keyframes premiumAir {
  0%,100% { transform: translateX(0) scaleX(1); opacity: .72; }
  50% { transform: translateX(-18px) scaleX(1.08); opacity: 1; }
}
@keyframes premiumParticle {
  0%,100% { transform: translate3d(0,0,0) scale(.85); opacity: .45; }
  50% { transform: translate3d(0,-18px,18px) scale(1.15); opacity: 1; }
}
@keyframes premiumHeroIn {
  from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(4px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes premiumBadge {
  0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 35px rgba(0,98,172,.12), inset 0 0 25px rgba(255,255,255,.025); }
  50% { box-shadow: 0 0 0 1px rgba(0,180,216,.16), 0 12px 42px rgba(0,180,216,.18), inset 0 0 30px rgba(255,255,255,.035); }
}
@keyframes premiumTitleGlow {
  0%,100% { filter: drop-shadow(0 0 12px rgba(243,146,0,.10)); }
  50% { filter: drop-shadow(0 0 24px rgba(243,146,0,.25)); }
}

@media (max-width: 768px) {
  .hero-3d-scene { transform: scale(.82); opacity: .86; }
  .hero::before { filter: blur(22px); }
  .feature-card:hover,
  .product-card:hover,
  .service-card:hover,
  .contact-card:hover,
  .maintenance-card:hover { transform: translateY(-5px); }
}

@media (prefers-reduced-motion: reduce) {
  .hero::before,
  .hero::after,
  .hero-3d-unit,
  .hero-3d-side,
  .hero-3d-rings,
  .hero-3d-air,
  .hero-3d-particle,
  .hero-content,
  .authorized-badge,
  .hero-title span { animation: none !important; }
  .feature-card:hover,
  .product-card:hover,
  .service-card:hover,
  .contact-card:hover,
  .maintenance-card:hover { transform: none; }
}
'''
              p.write_text(s.rstrip() + premium + '\n', encoding='utf-8')
          PY

      - name: Commit enhancement and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q 'TRYANGLE PREMIUM MOTION v1' styles.css; then
            git add styles.css
            git commit -m "feat: upgrade premium 3D motion and interactions" || true
          fi
          git rm -f .github/workflows/premium-motion.yml || true
          git commit -m "chore: remove temporary enhancement workflow" || true
          git push
